name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Electron needs a display; xvfb gives the smoke test a headless one so
      # the real window still has to load and stay alive.
      - name: Install headless display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: End-to-end smoke test
        run: xvfb-run -a npm run smoke

      - name: Build
        run: npm run build
