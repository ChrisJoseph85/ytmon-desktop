name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Electron needs a display; xvfb gives the smoke test a headless one so
      # the real window still has to load and stay alive.
      - name: Install headless display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Both harnesses below launch the real Electron build, so they need the
      # built app. `npm ci` only runs the postinstall build-main step, which
      # produces dist/main and dist/preload but NOT the renderer — without
      # this the window opens on chrome-error://chromewebdata/ and every check
      # silently passes against an empty page.
      - name: Build
        run: npm run build

      # Electron needs a display; xvfb gives these a headless one so the real
      # window still has to load and stay alive.
      - name: End-to-end smoke test
        run: xvfb-run -a npm run smoke

      # Catches the class of bug where a screen's content outgrows the window
      # and `body { overflow: hidden }` clips the overflow into space the user
      # cannot scroll to, so settings below the fold become unreachable.
      - name: Layout / scrollability check
        run: xvfb-run -a npm run layout
